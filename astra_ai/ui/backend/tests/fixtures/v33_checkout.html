<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fixture Store — Checkout</title>
  <style>
    body { font-family: "Inter", system-ui, sans-serif; color: #1f2328; background-color: #ffffff; }
    .hint { color: #9a9a9a; }
    .error { color: #d93025; }
    .pay { background-color: #0b57d0; color: #ffffff; }
    .card { border: 1px solid #e0e0e0; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/logo.svg"></a>
    <nav><a href="/shop">Shop</a> <a href="/help">Help</a> <a href="/cart"><svg width="16" height="16"></svg></a></nav>
  </header>
  <h1>Checkout</h1>
  <h3>Delivery</h3>
  <form>
    <label for="name">Full name</label>
    <input id="name" type="text">
    <input id="email" type="email" placeholder="Email">
    <select id="country"><option>Spain</option><option>France</option></select>
    <label><input type="checkbox"> Save my details</label>
    <p class="hint">We never share your address.</p>
    <p class="error">Please enter a valid email.</p>
    <div class="card">
      <h2>Order summary</h2>
      <img src="/sofa.jpg" alt="Green sofa">
      <img src="/promo.png">
      <input id="promo" type="text" placeholder="Promo code">
      <button type="button" class="apply"><svg width="12" height="12"></svg></button>
    </div>
    <button type="submit" class="pay">Pay now</button>
    <a href="/terms">click here</a>
  </form>
  <footer><a href="/privacy">Privacy</a></footer>
</body>
</html>
